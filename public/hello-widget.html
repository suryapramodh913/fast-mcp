<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: system-ui, Arial; padding: 12px; }
      .card { border: 1px solid #ddd; border-radius: 14px; padding: 12px; }
      .title { font-weight: 700; margin-bottom: 8px; }
      #msg { font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Greeting</div>
<div id="msg">Waiting for tool result…</div>
<pre id="data">Data…</pre>

    </div>

<script>
  const msgEl = document.getElementById("msg");
  const dataEl = document.getElementById("data");

  function safeStringify(obj) {
    const seen = new WeakSet();
    return JSON.stringify(obj, (k, v) => {
      if (typeof v === "object" && v !== null) {
        if (seen.has(v)) return "[Circular]";
        seen.add(v);
      }
      return v;
    }, 2);
  }

  function renderFromToolResult(toolResult) {
    // toolResult is expected to look like:
    // { structuredContent: { message: ... }, content: [...], _meta: {...} }
    console.log("renderFromToolResult called with:", toolResult);
    
    // Try to extract message from various possible locations
    let message = toolResult?.structuredContent?.message;
    
    // Fallback: check if the message is in content array
    if (!message && toolResult?.content?.[0]?.text) {
      message = toolResult.content[0].text;
    }
    
    // Fallback: check if toolResult itself is the message
    if (!message && typeof toolResult === 'string') {
      message = toolResult;
    }
    
    if (message) {
      msgEl.textContent = message;
      console.log("Updated message to:", message);
    } else {
      console.warn("No message found in toolResult:", toolResult);
    }
  }

  // ✅ 1) On load, read the latest tool output snapshot if available
  console.log("Checking window.openai:", window.openai);
  if (window.openai?.toolOutput) {
    console.log("Found window.openai.toolOutput:", window.openai.toolOutput);
    renderFromToolResult(window.openai.toolOutput);
    dataEl.textContent = safeStringify({ source: "window.openai.toolOutput", toolOutput: window.openai.toolOutput });
  } else {
    console.log("window.openai.toolOutput not available");
    // Show a default message when opened standalone
    msgEl.textContent = "Hello, World! (default - waiting for tool invocation)";
    dataEl.textContent = "No initial tool output available. Waiting for messages...";
  }

  // ✅ 2) Also listen for live notifications from the host (MCP Apps bridge)
  window.addEventListener("message", (event) => {
    const m = event?.data;
    console.log("Received message:", m);

    // Debug: show everything we receive
    dataEl.textContent = safeStringify({ source: "postMessage", data: m });

    if (!m || m.jsonrpc !== "2.0") {
      console.log("Ignoring non-JSON-RPC message");
      return;
    }
    if (m.method !== "ui/notifications/tool-result") {
      console.log("Ignoring non-tool-result notification");
      return;
    }

    console.log("Processing tool result notification, params:", m.params);
    // Extract the tool result from params.result if it exists, otherwise use params directly
    const toolResult = m.params?.result || m.params;
    renderFromToolResult(toolResult);
  }, { passive: true });
</script>

  </body>
</html>
