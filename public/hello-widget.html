<div id="msg">Waiting for tool result…</div>

<script>
  window.addEventListener(
    "message",
    (event) => {
      if (event.source !== window.parent) return;
      const m = event.data;
      if (!m || m.jsonrpc !== "2.0") return;
      if (m.method !== "ui/notifications/tool-result") return;

      const message = m.params?.result?.structuredContent?.message;
      if (message) document.getElementById("msg").textContent = message;
    },
    { passive: true }
  );
</script>
