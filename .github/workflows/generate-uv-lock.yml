name: Generate uv.lock

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove bad lockfile if exists
        run: rm -f uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Generate lockfile
        run: uv lock

      - name: Commit uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Generate uv.lock" || echo "No changes"
          git push
